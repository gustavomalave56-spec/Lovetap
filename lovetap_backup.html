<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovetap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#180B1D;
  --bg-2:#22112A;
  --bg-elevated:#2C1836;
  --card:#331D3F;
  --accent:#FF2E88;
  --accent-dark:#C8146A;
  --gold:#F2C14E;
  --teal:#3EC6A8;
  --coral:#FF6B6B;
  --text:#F7ECEF;
  --text-dim:#C9A8BE;
  --text-faint:#8A6C82;
  --border:rgba(247,236,239,0.12);
  --shadow: 0 20px 60px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 10%, rgba(255,46,136,0.16), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(62,198,168,0.10), transparent 40%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.display{font-family:'Baloo 2',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select{font-family:inherit;}
#app{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:8px;}

.center-wrap{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.logo-bottle{width:64px;height:64px;margin-bottom:10px;}
.h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;letter-spacing:-0.5px;margin:6px 0 4px;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{color:var(--text-dim);font-size:15px;max-width:420px;margin-bottom:34px;line-height:1.5;}

.home-wrap{width:100%;max-width:480px;margin:0 auto;}
.home-topstats{display:flex;gap:8px;margin-bottom:16px;}
.stat-pill{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px 6px;text-align:center;}
.stat-pill .top{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:14px;}
.stat-pill .sub-label{font-size:9px;color:var(--text-faint);margin-top:3px;background:var(--bg-2);border-radius:6px;padding:1px 4px;display:inline-block;}
.stat-pill.coins{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;}
.coin-add{width:20px;height:20px;border-radius:6px;background:var(--teal);color:#062b23;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;cursor:pointer;}

.home-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.home-avatar-wrap{position:relative;flex-shrink:0;cursor:pointer;}
.home-avatar-wrap .avatar-img, .home-avatar-wrap .avatar-placeholder{width:60px;height:60px;font-size:22px;}
.home-gear{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;margin-left:auto;cursor:pointer;}
.home-name-row{display:flex;flex-direction:column;gap:5px;min-width:0;}
.home-name{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.home-badges{display:flex;gap:6px;flex-wrap:wrap;}
.vip-badge{background:linear-gradient(135deg,var(--gold),#d99f2b);color:#2A1808;font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;}
.home-quickstats{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text-dim);}
.home-quickstats span{display:flex;align-items:center;gap:3px;cursor:pointer;}

.home-banner{background:linear-gradient(135deg, var(--bg-elevated), var(--bg-2));border:1px solid var(--border);border-radius:18px;padding:22px 16px;text-align:center;margin:4px 0 12px;}
.home-banner .emoji-big{font-size:36px;}
.home-banner .title{font-weight:800;margin-top:8px;font-size:14px;}
.carousel-dots{display:flex;gap:5px;justify-content:center;margin-top:12px;}
.carousel-dots .d{width:5px;height:5px;border-radius:50%;background:var(--text-faint);}
.carousel-dots .d.active{background:var(--text);width:14px;border-radius:4px;}

.home-cta{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;}
.cta-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 22px;border-radius:16px;font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--gold),#e0ab30);color:#2A1808;box-shadow:0 8px 20px rgba(242,193,78,0.25);width:100%;}
.cta-btn.secondary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:white;box-shadow:0 8px 20px rgba(255,46,136,0.3);}

.home-layout{display:flex;gap:10px;align-items:flex-start;}
.side-rail{display:flex;flex-direction:column;gap:10px;}
.side-icon{width:50px;height:50px;border-radius:14px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:19px;position:relative;flex-shrink:0;cursor:pointer;}
.side-icon .badge-num{position:absolute;top:-6px;right:-6px;background:var(--accent);color:white;font-size:9px;font-weight:800;border-radius:8px;padding:1px 5px;min-width:14px;text-align:center;}
.home-center{flex:1;min-width:0;}

.league-row{display:flex;gap:10px;margin-top:18px;}
.league-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;}
.league-card .emoji-big{font-size:24px;}
.league-card .label{font-weight:700;font-size:10.5px;margin:6px 0 4px;line-height:1.3;}
.league-card .time{font-size:10px;color:var(--text-faint);background:var(--bg-2);border-radius:6px;padding:2px 6px;display:inline-block;}

@media(max-width:480px){
  .home-layout{flex-direction:column;}
  .side-rail{flex-direction:row;justify-content:center;width:100%;}
}
.btn{padding:14px 26px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:white;box-shadow:0 8px 24px rgba(255,46,136,0.35);}
.btn-primary:hover{box-shadow:0 10px 30px rgba(255,46,136,0.5);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#d99f2b);color:#2A1808;}
.btn-teal{background:linear-gradient(135deg,var(--teal),#2a9c85);color:#062b23;}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--bg-elevated);}
.btn-danger{background:rgba(255,107,107,0.15);color:var(--coral);border:1px solid rgba(255,107,107,0.35);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-sm{padding:8px 14px;border-radius:10px;font-size:13px;}
.btn-xs{padding:4px 9px;border-radius:8px;font-size:11px;background:var(--bg-2);color:var(--text);border:1px solid var(--border);}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;}
.field{margin-bottom:16px;text-align:left;}
.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-faint);margin-bottom:6px;font-weight:600;}
.field input[type=text], .field select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-2);color:var(--text);font-size:15px;outline:none;}
.field input[type=text]:focus, .field select:focus{border-color:var(--accent);}
.err{color:var(--coral);font-size:13px;margin-top:6px;min-height:16px;}
.code-input{text-transform:uppercase;letter-spacing:4px;font-family:'JetBrains Mono',monospace;text-align:center;font-size:20px;}

.avatar-preview-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px;}
.avatar-img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--bg-2);}
.avatar-placeholder{width:96px;height:96px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--text-faint);}
.frame-gold{box-shadow:0 0 0 4px var(--gold), 0 0 20px rgba(242,193,78,0.5);}
.frame-pink{box-shadow:0 0 0 4px var(--accent), 0 0 20px rgba(255,46,136,0.45);}
.frame-teal{box-shadow:0 0 0 4px var(--teal), 0 0 20px rgba(62,198,168,0.4);}
.frame-fire{box-shadow:0 0 0 4px #FF7A3C, 0 0 22px rgba(255,122,60,0.55);}
.frame-silver{box-shadow:0 0 0 4px #CFD8DC, 0 0 16px rgba(207,216,220,0.4);}
.frame-none{box-shadow:0 0 0 3px rgba(255,255,255,0.15);}
.frame-swatches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.frame-swatch{width:36px;height:36px;border-radius:50%;background:var(--bg-2);cursor:pointer;border:2px solid transparent;}
.frame-swatch.selected{border-color:white;}
.upload-btn{padding:8px 14px;border-radius:10px;background:var(--bg-2);border:1px dashed var(--border);color:var(--text-dim);font-size:13px;}
.pill-select{display:flex;gap:8px;flex-wrap:wrap;}
.pill{padding:8px 14px;border-radius:999px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-dim);font-size:13px;font-weight:600;}
.pill.selected{background:var(--accent);border-color:var(--accent);color:white;}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.room-code-badge{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);padding:8px 14px;border-radius:12px;}
.room-code-badge .code{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:3px;font-size:16px;color:var(--gold);}
.sync-badge{font-size:11px;color:var(--text-faint);display:flex;align-items:center;gap:5px;}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.lobby-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:20px 0;}
.seat-mini{position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.seat-mini.empty{opacity:0.35;border-style:dashed;}
.seat-mini .remove-x{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:rgba(255,107,107,0.18);color:var(--coral);font-size:12px;display:flex;align-items:center;justify-content:center;}
.name-tag{font-weight:700;font-size:13px;}
.badge{font-size:10px;padding:3px 8px;border-radius:999px;font-weight:700;letter-spacing:0.3px;}
.badge-control{background:rgba(62,198,168,0.18);color:var(--teal);}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:12px;}
.settings-row:last-child{border-bottom:none;}
.toggle{width:42px;height:24px;border-radius:999px;background:var(--bg-2);position:relative;transition:background .2s;flex-shrink:0;cursor:pointer;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:white;transition:left .2s;}
.toggle.on::after{left:21px;}

.game-layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
@media (max-width:860px){.game-layout{grid-template-columns:1fr;}}
.table-wrap{background:radial-gradient(circle at center, var(--bg-elevated) 0%, var(--bg-2) 70%);border:1px solid var(--border);border-radius:24px;padding:20px;position:relative;min-height:520px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.circle-table{position:relative;width:440px;height:440px;max-width:100%;border-radius:50%;background:radial-gradient(circle, rgba(255,46,136,0.06), transparent 70%);border:1px solid rgba(255,255,255,0.06);}
.seat{position:absolute;width:76px;height:76px;margin-left:-38px;margin-top:-38px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2;}
.seat .avatar-img, .seat .avatar-placeholder{width:52px;height:52px;font-size:20px;}
.seat .name-tag{font-size:11px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim);}
.seat.active-turn .avatar-img, .seat.active-turn .avatar-placeholder{box-shadow:0 0 0 3px var(--gold), 0 0 18px rgba(242,193,78,0.7)!important;}
.seat.is-target{animation:target-pulse 0.9s infinite;}
@keyframes target-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.seat.absent{opacity:0.3;}
.seat .crown{position:absolute;top:-14px;font-size:14px;}
.seat .bot-tag{position:absolute;bottom:-4px;font-size:10px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;padding:0 3px;}
.gift-effect{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;pointer-events:none;}

.bottle-center{position:absolute;top:50%;left:50%;width:14px;height:100px;margin-left:-7px;margin-top:-50px;transform-origin:50% 50%;transition:transform 3s cubic-bezier(.2,.8,.15,1);z-index:3;}
.bottle-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.5));}
.spin-btn-wrap{position:absolute;bottom:-46px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:4;}

.result-banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);border:1px solid var(--border);padding:8px 18px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:var(--shadow);z-index:4;}

.side-panel{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;height:560px;}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--text-faint);background:transparent;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.tab-content{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.chat-msg{font-size:13px;line-height:1.4;}
.chat-msg .who{font-weight:700;color:var(--accent);}
.chat-msg.system{color:var(--text-faint);font-style:italic;text-align:center;font-size:12px;}
.chat-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);}
.chat-input-row input{flex:1;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);outline:none;font-size:13px;}
.gift-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.gift-item{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;font-size:12px;}
.gift-item .emoji{font-size:22px;}
.gift-item .cost{color:var(--gold);font-weight:700;font-size:11px;margin-top:3px;}
.player-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--bg-2);}
.player-row .info{flex:1;min-width:0;}
.player-row .info .n{font-weight:700;font-size:13px;}
.player-row .info .s{font-size:11px;color:var(--text-faint);}
.player-row.conv-row{cursor:pointer;}
.player-row.conv-row:hover{background:var(--bg-elevated);}
.mission-item{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:12px;}
.mission-item.done{opacity:0.5;text-decoration:line-through;}

.stat-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);padding:7px 12px;border-radius:12px;font-size:13px;font-weight:700;}

.modal-overlay{position:fixed;inset:0;background:rgba(10,4,14,0.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow);}
.timer-ring{width:64px;height:64px;margin:0 auto 14px;position:relative;border-radius:50%;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;}
.timer-num{font-weight:800;font-size:20px;font-family:'JetBrains Mono',monospace;}

.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--bg-elevated);border:1px solid var(--border);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:toast-in .2s ease;}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

.founder-panel{display:flex;flex-direction:column;gap:10px;}
.info-note{font-size:11px;color:var(--text-faint);line-height:1.5;background:var(--bg-2);padding:10px;border-radius:10px;}

.settings-list-row{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:600;}
.settings-list-row:last-child{border-bottom:none;}
.settings-list-row:hover{background:var(--bg-elevated);}
.dm-bubble{background:var(--bg-2);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.4;max-width:78%;align-self:flex-start;}
.dm-bubble.me{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:white;align-self:flex-end;}
.back-btn{display:flex;align-items:center;gap:6px;}
.profile-counters{display:flex;gap:28px;margin-top:18px;}
.profile-counters .box{text-align:center;}
.profile-counters .box .n{font-weight:800;font-size:19px;}
.profile-counters .box .l{font-size:11px;color:var(--text-faint);margin-top:2px;}

@media(max-width:520px){
  .h1{font-size:32px;}
  .circle-table{width:320px;height:320px;}
  .seat{width:60px;height:60px;margin-left:-30px;margin-top:-30px;}
  .seat .avatar-img,.seat .avatar-placeholder{width:42px;height:42px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ================= CONFIG ================= */
const POLL_MS = 4000;
const SPIN_MS = 3000;
const DECIDE_MS = 10000;
const GIFTS = {
  positive: [
    {id:'flores', label:'Flores', emoji:'🌹', cost:10},
    {id:'chocolates', label:'Chocolates', emoji:'🍫', cost:20},
    {id:'joyas', label:'Joyas', emoji:'💎', cost:50},
  ],
  negative: [
    {id:'huevo', label:'Huevo', emoji:'🥚', cost:5, currency:'coins'},
    {id:'tomate', label:'Tomate', emoji:'🍅', cost:5, currency:'coins'},
    {id:'hielo', label:'Hielo', emoji:'🧊', cost:3, currency:'hearts'},
  ]
};
const GIFT_EMOJI = {flores:'🌹',chocolates:'🍫',joyas:'💎',huevo:'🥚',tomate:'🍅',hielo:'🧊'};
const FRAMES = ['gold','pink','teal','fire','silver','none'];
const MISSIONS = [
  {id:'first_kiss', label:'Consigue tu primer beso mutuo', reward:15, check:(p)=>p.sympathy>=1},
  {id:'first_gift', label:'Envía tu primer regalo', reward:10, check:(p)=>(p.sentGifts||0)>=1},
  {id:'level3', label:'Alcanza el nivel 3', reward:30, check:(p)=>p.level>=3},
];
const BOT_NAMES = ['Luna','Max','Ray','Nina','Kai','Zoe','Leo','Mia','Alex','Dana','Theo','Vale'];
const BOT_KISS_LINES = ['😘','¡Qué lindo!','Me encantó 💕','jaja bueno va','Aww 🥰'];
const BOT_REJECT_LINES = ['Nah, paso 😅','Mejor no jaja','Uy no 🙈','jajaja no no'];

/* ================= STORAGE HELPERS ================= */
async function safeGet(key, shared){
  try{ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function safeSet(key, value, shared){
  try{ const r = await window.storage.set(key, JSON.stringify(value), shared); return !!r; }
  catch(e){ console.error('storage set failed', e); return false; }
}

/* ================= IDENTITY & PROFILE ================= */
let myId = null;
let profile = null;

async function ensureIdentity(){
  const existing = await safeGet('identity', false);
  if(existing && existing.id) return existing.id;
  const id = (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)+Date.now());
  await safeSet('identity', {id}, false);
  return id;
}
async function loadProfile(){ return await safeGet('profile', false); }

/* ================= SHARED SOCIAL GRAPH (followers/following/gifts) ================= */
async function updateSharedSocial(id, mutator){
  let rec = await safeGet('social:'+id, true) || {following:[], followers:[]};
  mutator(rec);
  let ok = await safeSet('social:'+id, rec, true);
  if(!ok){
    await new Promise(r=>setTimeout(r,500));
    rec = await safeGet('social:'+id, true) || {following:[], followers:[]};
    mutator(rec);
    await safeSet('social:'+id, rec, true);
  }
}
async function syncSocialRecord(){
  if(!profile) return;
  await updateSharedSocial(myId, rec=>{
    rec.name = profile.name; rec.photo = profile.photo||null; rec.frame = profile.frame||'none';
    rec.giftsReceivedTotal = profile.giftsReceivedTotal||0;
    rec.following = rec.following||[]; rec.followers = rec.followers||[];
  });
}

/* ================= HOME-LEVEL MISSIONS & STAT SYNC ================= */
function checkHomeMissions(){
  profile.missionsCompleted = profile.missionsCompleted||[];
  const proxy = {sympathy:profile.sympathyTotal||0, sentGifts:profile.giftsSentTotal||0, level:profile.level||1};
  MISSIONS.forEach(m=>{
    if(!profile.missionsCompleted.includes(m.id) && m.check(proxy)){
      profile.missionsCompleted.push(m.id);
      profile.walletCoins = (profile.walletCoins||0)+m.reward;
    }
  });
}
async function syncProfileFromRoomPlayer(player){
  if(!profile || !player) return;
  let changed = false;
  if(state._syncedCoins===undefined){
    state._syncedCoins = player.coins;
  } else if(player.coins !== state._syncedCoins){
    profile.walletCoins = (profile.walletCoins||0) + (player.coins - state._syncedCoins);
    state._syncedCoins = player.coins;
    changed = true;
  }
  if((player.sympathy||0) > (profile.sympathyTotal||0)){ profile.sympathyTotal = player.sympathy; changed=true; }
  if((player.sentGifts||0) > (profile.giftsSentTotal||0)){ profile.giftsSentTotal = player.sentGifts; changed=true; }
  if((player.giftsReceived||0) > (profile.giftsReceivedTotal||0)){ profile.giftsReceivedTotal = player.giftsReceived; changed=true; }
  if((player.level||1) > (profile.level||1)){ profile.level = player.level; profile.xp = player.xp||0; changed=true; }
  if(changed){
    checkHomeMissions();
    await saveProfileToStore();
    syncSocialRecord();
  }
}

/* Central place that applies a fresh room to local state, syncs the bottle
   animation so every client sees the same spin, switches screens if needed,
   re-renders, lets bots take their turn if it's their move, and syncs my
   room stats (coins/sympathy/gifts/level) back into my persistent profile. */
function applyRoomUpdate(room){
  state.room = room;
  syncBottleAnimation(room);
  if(room.turn && room.turn.phase!=='lobby' && state.screen==='lobby') state.screen='game';
  render();
  maybeRunBots();
  scheduleResolveCheck(room);
  const myself = findMe(room);
  if(myself) syncProfileFromRoomPlayer(myself);
}

/* Instead of asking the server every poll tick whether a decision timed out,
   each client schedules exactly one check right at the deadline. Cuts a lot
   of redundant storage traffic during the 10s decision window. */
let resolveScheduledKey = null;
function scheduleResolveCheck(room){
  const turn = room.turn||{};
  if(turn.phase==='deciding' && turn.deadline){
    const key = room.code+':'+turn.deadline;
    if(resolveScheduledKey!==key){
      resolveScheduledKey = key;
      const wait = Math.max(300, turn.deadline - Date.now() + 300);
      setTimeout(()=>maybeResolve(room.code), wait);
    }
  } else {
    resolveScheduledKey = null;
  }
}

function syncBottleAnimation(room){
  const turn = room.turn||{};
  if(turn.phase==='spinning' && turn.targetPlayerId){
    const key = 'spin:'+turn.targetPlayerId+':'+(turn.spinStartedAt||'');
    if(spinAnimKey!==key){
      spinAnimKey = key;
      const target = room.players.find(p=>p.id===turn.targetPlayerId);
      const seatAngleTarget = target ? (target.seat/12)*360 : 0;
      const base = Math.ceil((state.spinAngle||0)/360)*360;
      state.spinAngle = base + 4*360 + seatAngleTarget;
    }
  }
}

/* ================= PHOTO HANDLING ================= */
function fileToCompressedDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = ()=>reject(new Error('img error'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('read error'));
    reader.readAsDataURL(file);
  });
}

      return `<div class="mission-item ${done?'done':''}">${done?'✅':'⬜'} ${m.label} <span style="color:var(--gold);float:right;">+${m.reward} 🪙</span></div>`;
    }).join('');

    return `

        <div class="info-note">${isFounder ? 'Sos el fundador de esta sala.' : 'Tenés el control temporal de la sala.'}</div>

function renderDecisionModal(room, myself){
  const turn = room.turn;
  const other = room.players.find(p=> p.id === (myself.id===turn.activePlayerId ? turn.targetPlayerId : turn.activePlayerId));
  const secondsLeft = Math.max(0, Math.ceil((turn.deadline - Date.now())/1000));
  return `
  <div class="modal-overlay">
    <div class="modal">
      <div class="timer-ring"><div class="timer-num" id="decideTimer">${secondsLeft}</div></div>
      <div style="font-weight:800;font-size:17px;margin-bottom:6px;" class="display">La botella te apunta a ${esc(other?other.name:'??')}</div>
      <div style="color:var(--text-dim);font-size:13px;margin-bottom:20px;">¿Qué hacés?</div>
      <div class="row">
        <button class="btn btn-primary" data-action="decide" data-choice="kiss">💋 Besar</button>
        <button class="btn btn-ghost" data-action="decide" data-choice="reject">🙅 Rechazar</button>
      </div>
    </div>
  </div>`;
}

async function openConversations(){
  state.screen = 'conversations';
  state.conversationsList = null;
  render();
  const friends = profile.friends || [];
  const results = [];
  for(const f of friends){
    const key = 'dm:'+[myId,f.id].sort().join('_');
    const thread = await safeGet(key, true);
    const msgs = (thread && thread.messages) || [];
    const last = msgs[msgs.length-1];
    const readTs = (profile.dmReadTs && profile.dmReadTs[f.id]) || 0;
    results.push({
      id:f.id, name:f.name, photo:f.photo||null, frame:f.frame||'none',
      lastMessage: last ? ((last.from===myId?'Tú: ':'')+last.text) : null,
      unread: !!(last && last.from!==myId && last.ts>readTs),
    });
  }
  state.conversationsList = results;
  if(state.screen==='conversations') render();
}

async function openDm(contactId){
  const friend = (profile.friends||[]).find(f=>f.id===contactId);
  state.dmContact = friend || {id:contactId, name:'Usuario', photo:null, frame:'none'};
  state.screen = 'dmChat';
  state.dmMessages = null;
  render();
  const key = 'dm:'+[myId,contactId].sort().join('_');
  const thread = await safeGet(key, true);
  state.dmMessages = (thread && thread.messages) || [];
  profile.dmReadTs = profile.dmReadTs || {};
  profile.dmReadTs[contactId] = Date.now();
  await saveProfileToStore();
  if(state.screen==='dmChat') render();
}
async function sendDm(){
  const input = document.getElementById('dmInput');
  if(!input || !state.dmContact) return;
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  const contactId = state.dmContact.id;
  const key = 'dm:'+[myId,contactId].sort().join('_');
  let thread = await safeGet(key, true) || {messages:[]};
  thread.messages.push({from:myId, text, ts:Date.now()});
  if(thread.messages.length>200) thread.messages = thread.messages.slice(-200);
  await safeSet(key, thread, true);
  state.dmMessages = thread.messages;
  render();
}

/* ================= HANDLERS ================= */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{ el.onclick = onAction; });
  document.querySelectorAll('.frame-swatch').forEach(el=>{
    el.onclick = ()=>{ state.draft.frame = el.dataset.frame; render(); };
  });
  document.querySelectorAll('#genderPills .pill').forEach(el=>{
    el.onclick = ()=>{ state.draft.gender = el.dataset.gender; render(); };
  });
  document.querySelectorAll('#prefPills .pill').forEach(el=>{
    el.onclick = ()=>{ state.draft.genderPref = el.dataset.pref; render(); };
  });
  const nameInput = document.getElementById('nameInput');
  if(nameInput){
    nameInput.oninput = (e)=>{ state.draft.name = e.target.value; };
    if(document.activeElement !== nameInput){ /* keep focus untouched elsewhere */ }
  }
  const photoInput = document.getElementById('photoInput');
  if(photoInput) photoInput.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await fileToCompressedDataUrl(file);
      state.draft.photo = dataUrl;
      render();
    }catch(err){ state.error = 'No se pudo procesar la imagen.'; render(); }
  };
  const joinCodeInput = document.getElementById('joinCodeInput');
  if(joinCodeInput) joinCodeInput.oninput = (e)=>{ state.roomCodeInput = e.target.value.toUpperCase(); };
  document.querySelectorAll('.tab[data-tab]').forEach(t=>{ if(!t.dataset.action) t.onclick = ()=>{ state.activeTab = t.dataset.tab; render(); }; });
  const chatInput = document.getElementById('chatInput');
  if(chatInput){
    chatInput.onkeydown = (e)=>{ if(e.key==='Enter') sendChat(); };
    chatInput.focus();
  }
}

async function onAction(e){
  const action = e.currentTarget.dataset.action;
  if(action==='go-create'){ state.intent='create'; await handleCreateRoom(); }
  else if(action==='go-join'){ state.intent='join'; state.error=''; render(); }
  else if(action==='confirm-join'){ await handleJoinRoom(); }
  else if(action==='back-landing'){ state.draft=null; state.screen='landing'; state.intent=null; render(); }
  else if(action==='save-profile'){ await handleSaveProfile(); }
  else if(action==='start-game'){ await handleStartGame(); }
  else if(action==='leave-room'){ await handleLeaveRoom(); }
  else if(action==='toggle-pref'){ await handleTogglePref(); }
  else if(action==='edit-initial-coins'){ await handleEditInitialCoins(); }
  else if(action==='spin-bottle'){ await handleSpin(); }
  else if(action==='send-chat'){ await sendChat(); }
  else if(action==='add-friend'){ await handleAddFriend(e.currentTarget.dataset.target); }
  else if(action==='kick-player'){ await handleKick(e.currentTarget.dataset.target); }
  else if(action==='remove-bot'){ await handleKick(e.currentTarget.dataset.target); }
  else if(action==='add-bot'){ await handleAddBot(); }
  else if(action==='give-coins'){ await handleGiveCoins(); }
  else if(action==='transfer-control'){ await handleTransferControl(); }
  else if(action==='reclaim-control'){ await handleReclaimControl(); }
  else if(action==='decide'){ await handleDecide(e.currentTarget.dataset.choice); }
  else if(action==='open-profile-edit'){ initDraftProfile(); state.error=''; state.screen='profileForm'; render(); }
  else if(action==='toast-soon'){ toast('Próximamente ✨'); }
  else if(action==='open-missions'){ state.screen='missionsHome'; render(); }
  else if(action==='open-conversations'){ await openConversations(); }
  else if(action==='open-contacts'){ await openContacts(); }
  else if(action==='open-settings'){ state.screen='settings'; render(); }
  else if(action==='back-to-landing'){ state.screen='landing'; render(); }
  else if(action==='back-to-conversations'){ state.screen='conversations'; render(); }
  else if(action==='open-dm'){ await openDm(e.currentTarget.dataset.target); }
  else if(action==='send-dm'){ await sendDm(); }
  else if(action==='contacts-tab'){ state.contactsTab = e.currentTarget.dataset.tab; render(); }
  else if(action==='gift-info'){ toast('Los regalos se envían dentro de una sala de juego.'); }
  else if(action==='open-profile-detail'){ await openProfileDetail(e.currentTarget.dataset.target); }
  else if(action==='back-from-profile-detail'){ state.screen = state.profileDetailFrom||'landing'; render(); }
}

document.addEventListener('change', async (e)=>{
  if(e.target.classList && e.target.classList.contains('gift-target')){
    const targetId = e.target.value;
    if(!targetId) return;
    const giftId = e.target.dataset.gift;
    const cost = parseInt(e.target.dataset.cost,10);
    const currency = e.target.dataset.currency;
    await sendGift(giftId, targetId, cost, currency);
    e.target.value = '';
  }
});

/* ================= ACTION IMPLEMENTATIONS ================= */
async function handleCreateRoom(){
  if(!profile || !profile.name){ state._afterProfile='create'; initDraftProfile(); state.screen='profileForm'; state.error=''; render(); return; }
  state.loading = true; render();
  const code = genCode();
  const p = makePlayerFromProfile(0, 100);
  const room = {
    code, createdAt: Date.now(), founderId: myId, controllerId: myId,
    settings:{ matchPreference:false, initialCoins:100, privateChatFee:15 },
    players:[p],
    turn:{phase:'lobby'},
    chat:[{id:cryptoId(), system:true, text:`Sala creada por ${p.name} 🎉`, ts:Date.now()}],
    giftFeed:[],
  };
  state._syncedCoins = undefined;
  await saveRoom(room);
  state.loading=false;
  state.screen='lobby';
  startPolling();
  applyRoomUpdate(room);
}

async function handleJoinRoom(){
  const code = (state.roomCodeInput||'').trim().toUpperCase();
  if(code.length<4){ state.error='Ingresá un código válido.'; render(); return; }
  if(!profile || !profile.name){ state._pendingJoinCode = code; state._afterProfile='join'; initDraftProfile(); state.screen='profileForm'; state.error=''; render(); return; }
  await joinRoomWithCode(code);
}

async function joinRoomWithCode(code){
  state.loading = true; render();
  const room = await getRoom(code);
  if(!room){ state.loading=false; state.error='No encontramos esa sala.'; render(); return; }
  const existing = room.players.find(p=>p.id===myId);
  let reclaimed = false;
  if(existing){
    if(existing.kicked){ state.loading=false; state.error='Fuiste expulsado de esta sala.'; render(); return; }
    existing.present = true;
    existing.name = profile.name; existing.photo = profile.photo; existing.frame = profile.frame;
    existing.gender = profile.gender; existing.genderPref = profile.genderPref;
    if(existing.id===room.founderId){ room.controllerId = room.founderId; reclaimed = true; }
  } else {
    if(room.players.length>=12){ state.loading=false; state.error='La sala está llena.'; render(); return; }
    const seat = nextFreeSeat(room);
    const p = makePlayerFromProfile(seat, room.settings.initialCoins);
    room.players.push(p);
    room.chat = room.chat||[];
    room.chat.push({id:cryptoId(), system:true, text:`${p.name} se unió a la sala`, ts:Date.now()});
  }
  state._syncedCoins = undefined;
  await saveRoom(room);
  state.loading = false;
  state.screen = (room.turn && room.turn.phase!=='lobby') ? 'game' : 'lobby';
  startPolling();
  applyRoomUpdate(room);
  if(reclaimed) toast('Recuperaste el control de la sala como fundador 👑');
}

function nextFreeSeat(room){
  const taken = new Set(room.players.map(p=>p.seat));
  for(let i=0;i<12;i++) if(!taken.has(i)) return i;
  return room.players.length;
}

function makePlayerFromProfile(seat, coins){
  return {
    id: myId, name: profile.name, photo: profile.photo||null, frame: profile.frame||'none',
    gender: profile.gender||'NB', genderPref: profile.genderPref||'todos',
    seat, present:true, coins: coins!==undefined?coins:100, hearts:30,
    sympathy:0, popularity:0, xp:0, level:1, sentGifts:0, giftsReceived:0, missionsCompleted:[],
    kissedWith:[], unlockedChats:[], joinedAt: Date.now(), kicked:false, isBot:false,
  };
}

function makeBot(seat, coins, existingPlayers){
  const usedNames = new Set(existingPlayers.filter(p=>p.isBot).map(p=>p.name));
  let name = 'Bot';
  for(const n of BOT_NAMES){ if(!usedNames.has('Bot '+n)){ name = 'Bot '+n; break; } }
  const genders = ['M','F','NB'];
  const gender = genders[Math.floor(Math.random()*genders.length)];
  const frame = FRAMES[Math.floor(Math.random()*FRAMES.length)];
  return {
    id: 'bot-'+cryptoId(), name, photo:null, frame, gender, genderPref:'todos',
    seat, present:true, coins: coins!==undefined?coins:100, hearts:30,
    sympathy:0, popularity:0, xp:0, level:1, sentGifts:0, giftsReceived:0, missionsCompleted:[],
    kissedWith:[], unlockedChats:[], joinedAt: Date.now(), kicked:false, isBot:true,
  };
}

function cryptoId(){ return crypto.randomUUID ? crypto.randomUUID() : ('m-'+Math.random().toString(36).slice(2)); }

async function handleSaveProfile(){
  if(!state.draft) initDraftProfile();
  const name = (state.draft.name||'').trim();
  if(!name){ state.error='Ingresá un nombre.'; render(); return; }
  profile = profile || {};
  profile.name = name;
  profile.photo = state.draft.photo || null;
  profile.frame = state.draft.frame || 'pink';
  profile.gender = state.draft.gender || 'NB';
  profile.genderPref = state.draft.genderPref || 'todos';
  profile.friends = profile.friends || [];
  profile.walletCoins = profile.walletCoins || 0;
  profile.trophies = profile.trophies || 0;
  profile.crownPoints = profile.crownPoints || 0;
  profile.rank = profile.rank || 1;
  profile.sympathyTotal = profile.sympathyTotal || 0;
  profile.giftsSentTotal = profile.giftsSentTotal || 0;
  profile.giftsReceivedTotal = profile.giftsReceivedTotal || 0;
  profile.level = profile.level || 1;
  profile.xp = profile.xp || 0;
  profile.missionsCompleted = profile.missionsCompleted || [];
  profile.dmReadTs = profile.dmReadTs || {};
  state.loading = true; render();
  await saveProfileToStore();
  await syncSocialRecord();
  state.loading = false;
  state.draft = null;
  const after = state._afterProfile;
  state._afterProfile = null;
  if(after==='create') await handleCreateRoom();
  else if(after==='join') await joinRoomWithCode(state._pendingJoinCode);
  else { state.screen='landing'; render(); }
}

async function handleStartGame(){
  const room = await getRoom(state.room.code);
  const order = presentPlayers(room).sort((a,b)=>a.seat-b.seat).map(p=>p.id);
  room.turn = { phase:'idle', order, activeIndex:0, activePlayerId: order[0], targetPlayerId:null, decisions:{}, deadline:0, lastResult:null, spinStartedAt:0 };
  room.chat.push({id:cryptoId(), system:true, text:'¡La partida comenzó! 🍾', ts:Date.now()});
  await saveRoom(room);
  state.screen = 'game';
  applyRoomUpdate(room);
}

async function handleAddBot(){
  const room = await getRoom(state.room.code);
  if(!room) return;
  if(room.players.length>=12){ toast('La sala está llena.'); return; }
  const seat = nextFreeSeat(room);
  const bot = makeBot(seat, room.settings.initialCoins, room.players);
  room.players.push(bot);
  room.chat.push({id:cryptoId(), system:true, text:`🤖 ${bot.name} se unió a la sala como bot`, ts:Date.now()});
  await saveRoom(room);
  applyRoomUpdate(room);
}

async function handleLeaveRoom(){
  const room = state.room;
  const myself = findMe(room);
  if(myself){
    if(myself.id===room.founderId){
      const others = room.players.filter(p=>p.id!==room.founderId && p.present && !p.isBot);
      if(others.length>0 && room.controllerId===room.founderId){
        room.controllerId = others.sort((a,b)=>a.joinedAt-b.joinedAt)[0].id;
      }
    } else if(room.controllerId===myself.id){
      const others = room.players.filter(p=>p.id!==myself.id && p.present && !p.isBot);
      room.controllerId = others.length? others.sort((a,b)=>a.joinedAt-b.joinedAt)[0].id : room.founderId;
    }
    myself.present = false;
    room.chat.push({id:cryptoId(), system:true, text:`${myself.name} salió de la sala`, ts:Date.now()});
    await saveRoom(room);
  }
  stopPolling();
  state.room = null;
  state._syncedCoins = undefined;
  state.screen = 'landing';
  state.intent = null;
  render();
}

async function handleTogglePref(){
  const room = await getRoom(state.room.code);
  room.settings.matchPreference = !room.settings.matchPreference;
  await saveRoom(room);
  applyRoomUpdate(room);
}

async function handleEditInitialCoins(){
  const val = prompt('Monedas iniciales para nuevos jugadores:', state.room.settings.initialCoins);
  const n = parseInt(val,10);
  if(isNaN(n)||n<0) return;
  const room = await getRoom(state.room.code);
  room.settings.initialCoins = n;
  await saveRoom(room);
  applyRoomUpdate(room);
}

function isCompatible(a,b){
  const prefOk = (pref, gender) => pref==='todos' || (pref==='hombres'&&gender==='M') || (pref==='mujeres'&&gender==='F');
  return prefOk(a.genderPref,b.gender) && prefOk(b.genderPref,a.gender);
}

async function handleSpin(){
  const room = await getRoom(state.room.code);
  const turn = room.turn;
  const myself = findMe(room);
  const candidates = presentPlayers(room).filter(p=>p.id!==myself.id && (!room.settings.matchPreference || isCompatible(myself,p)));
  if(candidates.length===0){ toast('No hay jugadores disponibles para apuntar.'); return; }
  const target = candidates[Math.floor(Math.random()*candidates.length)];
  turn.phase='spinning';
  turn.targetPlayerId = target.id;
  turn.spinStartedAt = Date.now();
  await saveRoom(room);
  applyRoomUpdate(room);
  setTimeout(async ()=>{
    const r2 = await getRoom(room.code);
    if(!r2 || r2.turn.phase!=='spinning') return;
    r2.turn.phase='deciding';
    r2.turn.decisions={};
    r2.turn.deadline = Date.now()+DECIDE_MS;
    await saveRoom(r2);
    if(state.room && state.room.code===r2.code) applyRoomUpdate(r2);
  }, SPIN_MS);
}

async function botSpin(code, botId){
  const room = await getRoom(code);
  if(!room || !room.turn || room.turn.phase!=='idle' || room.turn.activePlayerId!==botId) return;
  const bot = room.players.find(p=>p.id===botId);
  if(!bot) return;
  const candidates = presentPlayers(room).filter(p=>p.id!==botId && (!room.settings.matchPreference || isCompatible(bot,p)));
  if(candidates.length===0){ advanceTurn(room); await saveRoom(room); if(state.room && state.room.code===code) applyRoomUpdate(room); return; }
  const target = candidates[Math.floor(Math.random()*candidates.length)];
  room.turn.phase='spinning';
  room.turn.targetPlayerId = target.id;
  room.turn.spinStartedAt = Date.now();
  await saveRoom(room);
  if(state.room && state.room.code===code) applyRoomUpdate(room);
  setTimeout(async ()=>{
    const r2 = await getRoom(code);
    if(!r2 || r2.turn.phase!=='spinning') return;
    r2.turn.phase='deciding';
    r2.turn.decisions={};
    r2.turn.deadline=Date.now()+DECIDE_MS;
    await saveRoom(r2);
    if(state.room && state.room.code===code) applyRoomUpdate(r2);
  }, SPIN_MS);
}

async function handleDecide(choice){
  const room = await getRoom(state.room.code);
  if(!room || room.turn.phase!=='deciding') return;
  room.turn.decisions = room.turn.decisions||{};
  room.turn.decisions[myId] = choice;
  await saveRoom(room);
  applyRoomUpdate(room);
  maybeResolve(room.code);
}

async function botDecide(code, botId){
  const room = await getRoom(code);
  if(!room || !room.turn || room.turn.phase!=='deciding') return;
  const turn = room.turn;
  if(turn.activePlayerId!==botId && turn.targetPlayerId!==botId) return;
  if(turn.decisions && turn.decisions[botId]) return;
  const bot = room.players.find(p=>p.id===botId);
  if(!bot) return;
  const choice = Math.random()<0.72 ? 'kiss' : 'reject';
  turn.decisions = turn.decisions||{};
  turn.decisions[botId] = choice;
  const line = choice==='kiss' ? BOT_KISS_LINES[Math.floor(Math.random()*BOT_KISS_LINES.length)] : BOT_REJECT_LINES[Math.floor(Math.random()*BOT_REJECT_LINES.length)];
  room.chat.push({id:cryptoId(), playerId:botId, name:bot.name, text:line, ts:Date.now()});
  await saveRoom(room);
  if(state.room && state.room.code===code) applyRoomUpdate(room);
  maybeResolve(code);
}

async function maybeResolve(code){
  const room = await getRoom(code);
  if(!room || room.turn.phase!=='deciding') return;
  const turn = room.turn;
  const activeD = turn.decisions[turn.activePlayerId];
  const targetD = turn.decisions[turn.targetPlayerId];
  const timedOut = Date.now() > turn.deadline;
  if((activeD && targetD) || timedOut){
    const mutual = activeD==='kiss' && targetD==='kiss';
    const activeP = room.players.find(p=>p.id===turn.activePlayerId);
    const targetP = room.players.find(p=>p.id===turn.targetPlayerId);
    if(mutual){
      activeP.sympathy=(activeP.sympathy||0)+1; targetP.sympathy=(targetP.sympathy||0)+1;
      activeP.hearts+=5; targetP.hearts+=5;
      activeP.kissedWith = Array.from(new Set([...(activeP.kissedWith||[]), targetP.id]));
      targetP.kissedWith = Array.from(new Set([...(targetP.kissedWith||[]), activeP.id]));
      room.chat.push({id:cryptoId(), system:true, text:`💋 ${activeP.name} y ${targetP.name} se besaron y ganaron simpatía`, ts:Date.now()});
      turn.lastResult = {type:'kiss', text:`💋 ¡${activeP.name} y ${targetP.name} se besaron!`};
    } else {
      room.chat.push({id:cryptoId(), system:true, text:`💔 Botella rota entre ${activeP.name} y ${targetP.name}`, ts:Date.now()});
      turn.lastResult = {type:'reject', text:'💔 Botella rota'};
    }
    awardXp(activeP, 10); awardXp(targetP, 10);
    checkMissions(activeP); checkMissions(targetP);
    turn.phase='resolved';
    await saveRoom(room);
    setTimeout(async ()=>{
      const r3 = await getRoom(code);
      if(!r3 || r3.turn.phase!=='resolved') return;
      advanceTurn(r3);
      await saveRoom(r3);
      if(state.room && state.room.code===code) applyRoomUpdate(r3);
    }, 3200);
    if(state.room && state.room.code===code) applyRoomUpdate(room);
  }
}

function advanceTurn(room){
  const order = presentPlayers(room).sort((a,b)=>a.seat-b.seat).map(p=>p.id);
  room.turn.order = order;
  if(order.length===0){ room.turn.phase='idle'; room.turn.activePlayerId=null; return; }
  let idx = order.indexOf(room.turn.activePlayerId);
  idx = (idx+1) % order.length;
  room.turn.phase='idle';
  room.turn.activeIndex = idx;
  room.turn.activePlayerId = order[idx];
  room.turn.targetPlayerId = null;
  room.turn.decisions = {};
  room.turn.lastResult = null;
}

function awardXp(player, amount){
  player.xp = (player.xp||0)+amount;
  const newLevel = Math.floor(player.xp/100)+1;
  if(newLevel>player.level){
    const bonus = 20*newLevel;
    player.coins += bonus;
    player.level = newLevel;
  }
}
function checkMissions(player){
  player.missionsCompleted = player.missionsCompleted||[];
  MISSIONS.forEach(m=>{
    if(!player.missionsCompleted.includes(m.id) && m.check(player)){
      player.missionsCompleted.push(m.id);
      player.coins += m.reward;
    }
  });
}

async function sendChat(){
  const input = document.getElementById('chatInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  const room = await getRoom(state.room.code);
  if(!room) return;
  const myself = findMe(room);
  room.chat = room.chat||[];
  room.chat.push({id:cryptoId(), playerId:myId, name:myself.name, text, ts:Date.now()});
  if(room.chat.length>80) room.chat = room.chat.slice(-80);
  await saveRoom(room);
  applyRoomUpdate(room);
}

async function sendGift(giftId, targetId, cost, currency){
  const room = await getRoom(state.room.code);
  if(!room) return;
  const myself = findMe(room);
  const target = room.players.find(p=>p.id===targetId);
  if(!target){ return; }
  if(currency==='coins' && myself.coins<cost){ toast('No tenés suficientes monedas.'); return; }
  if(currency==='hearts' && myself.hearts<cost){ toast('No tenés suficientes corazones.'); return; }
  if(currency==='coins') myself.coins-=cost; else myself.hearts-=cost;
  const isPositive = GIFTS.positive.some(g=>g.id===giftId);
  target.giftsReceived = (target.giftsReceived||0)+1;
  if(isPositive){
    target.popularity = (target.popularity||0)+1;
    room.chat.push({id:cryptoId(), system:true, text:`${GIFT_EMOJI[giftId]} ${myself.name} le envió ${giftId} a ${target.name}`, ts:Date.now()});
  } else {
    target.giftEffect = {type:giftId, expiresAt: Date.now()+60000};
    room.chat.push({id:cryptoId(), system:true, text:`${GIFT_EMOJI[giftId]} ${myself.name} le tiró ${giftId} a ${target.name}`, ts:Date.now()});
  }
  myself.sentGifts=(myself.sentGifts||0)+1;
  awardXp(myself,5);
  checkMissions(myself);
  await saveRoom(room);
  applyRoomUpdate(room);
}

async function handleAddFriend(targetId){
  const room = state.room;
  const target = room.players.find(p=>p.id===targetId);
  if(!target) return;
  profile.friends = profile.friends||[];
  if(!profile.friends.some(f=>f.id===targetId)){
    profile.friends.push({id:targetId, name:target.name, photo:target.photo||null, frame:target.frame||'none'});
    await saveProfileToStore();
    await updateSharedSocial(myId, rec=>{
      rec.following = rec.following||[];
      if(!rec.following.some(f=>f.id===targetId)) rec.following.push({id:targetId,name:target.name,photo:target.photo||null,frame:target.frame||'none'});
    });
    await updateSharedSocial(targetId, rec=>{
      rec.followers = rec.followers||[];
      if(!rec.followers.some(f=>f.id===myId)) rec.followers.push({id:myId,name:profile.name,photo:profile.photo||null,frame:profile.frame||'none'});
    });
    toast(`${target.name} agregado a tus amigos`);
  }
  render();
}

async function handleKick(targetId){
  const room = await getRoom(state.room.code);
  if(!room) return;
  const target = room.players.find(p=>p.id===targetId);
  if(!target) return;
  const wasInTurn = room.turn && (room.turn.activePlayerId===targetId || room.turn.targetPlayerId===targetId) && room.turn.phase && room.turn.phase!=='lobby';
  if(target.isBot){
    room.players = room.players.filter(p=>p.id!==targetId);
    room.chat.push({id:cryptoId(), system:true, text:`🤖 ${target.name} fue retirado de la sala`, ts:Date.now()});
  } else {
    target.present=false; target.kicked=true;
    room.chat.push({id:cryptoId(), system:true, text:`${target.name} fue expulsado de la sala`, ts:Date.now()});
  }
  if(wasInTurn && room.turn.phase!=='resolved') advanceTurn(room);
  await saveRoom(room);
  applyRoomUpdate(room);
}

async function handleGiveCoins(){
  const targetId = document.getElementById('giveCoinsTarget').value;
  const amount = parseInt(document.getElementById('giveCoinsAmount').value,10);
  if(!targetId || isNaN(amount) || amount<=0) return;
  const room = await getRoom(state.room.code);
  const target = room.players.find(p=>p.id===targetId);
  if(!target) return;
  target.coins += amount;
  room.chat.push({id:cryptoId(), system:true, text:`👑 El fundador le regaló ${amount} monedas a ${target.name}`, ts:Date.now()});
  await saveRoom(room);
  applyRoomUpdate(room);
}

async function handleTransferControl(){
  const targetId = document.getElementById('transferTarget').value;
  if(!targetId) return;
  const room = await getRoom(state.room.code);
  room.controllerId = targetId;
  const target = room.players.find(p=>p.id===targetId);
  room.chat.push({id:cryptoId(), system:true, text:`👑 El fundador cedió el control de la sala a ${target.name}`, ts:Date.now()});
  await saveRoom(room);
  applyRoomUpdate(room);
}

async function handleReclaimControl(){
  const room = await getRoom(state.room.code);
  room.controllerId = room.founderId;
  room.chat.push({id:cryptoId(), system:true, text:`👑 El fundador retomó el control de la sala`, ts:Date.now()});
  await saveRoom(room);
  applyRoomUpdate(room);
}

/* ================= BOT SCHEDULING ================= */
function maybeRunBots(){
  const room = state.room;
  if(!room || !room.turn) return;
  const turn = room.turn;
  if(turn.phase==='idle' && turn.activePlayerId){
    const activeP = room.players.find(p=>p.id===turn.activePlayerId);
    const key = room.code+':'+turn.activePlayerId+':idle';
    if(activeP && activeP.isBot && botSpinScheduledKey!==key){
      botSpinScheduledKey = key;
      setTimeout(()=>botSpin(room.code, activeP.id), 1200+Math.random()*1500);
    }
  } else {
    botSpinScheduledKey = null;
  }
  if(turn.phase==='deciding'){
    [turn.activePlayerId, turn.targetPlayerId].forEach(pid=>{
      const p = room.players.find(pp=>pp.id===pid);
      if(!p || !p.isBot) return;
      const already = turn.decisions && turn.decisions[pid];
      const key = room.code+':'+pid+':'+turn.deadline;
      if(!already && !botDecideScheduledKeys.has(key)){
        botDecideScheduledKeys.add(key);
        setTimeout(()=>botDecide(room.code, pid), 1000+Math.random()*3000);
      }
    });
  } else {
    botDecideScheduledKeys.clear();
  }
}

/* ================= POLLING ================= */
function startPolling(){
  stopPolling();
  pollTimer = setInterval(async ()=>{
    if(!state.room) return;
    const fresh = await getRoom(state.room.code);
    if(!fresh) return;
    if(fresh.version !== state.room.version){
      applyRoomUpdate(fresh);
    } else {
      state.room = fresh;
      maybeRunBots();
      scheduleResolveCheck(fresh);
    }
  }, POLL_MS);
}
function stopPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer=null; }

setInterval(()=>{
  const timerEl = document.getElementById('decideTimer');
  if(timerEl && state.room && state.room.turn && state.room.turn.phase==='deciding'){
    const left = Math.max(0, Math.ceil((state.room.turn.deadline-Date.now())/1000));
    timerEl.textContent = left;
  }
}, 500);

/* ================= INIT ================= */
async function init(){
  myId = await ensureIdentity();
  profile = await loadProfile();
  render();
}
init();
